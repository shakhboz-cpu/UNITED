<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>United Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FFFFFF; --bg2:#F1F1F3; --bg3:#ECECEF;
  --red:#E51B23; --red2:#ff3d38; --reddark:#a30f14;
  --yellow:#FFC928; --orange:#FF7A30; --green:#36A269;
  --white:#171717; --muted:#82786e;
  --border:rgba(23,23,23,.08); --glass:rgba(23,23,23,.04);
  --radius:20px; --shadow:0 12px 32px rgba(23,20,15,.10);
  --scrim:rgba(23,20,15,.5);
}
html[data-theme="dark"]{
  --bg:#0c0b0a; --bg2:#171513; --bg3:#211e1a;
  --red:#E51B23; --red2:#ff3d38; --reddark:#7a0d11;
  --yellow:#FFC928; --orange:#FF7A30; --green:#36A269;
  --white:#F7F4EE; --muted:#a39b8f;
  --border:rgba(255,255,255,.09); --glass:rgba(255,255,255,.055);
  --radius:20px; --shadow:0 14px 44px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6);
}
html,body{transition:background-color .25s ease;}
*{transition:background-color .2s ease, border-color .2s ease, color .2s ease;}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:.5px; text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
::selection{background:var(--red);color:#fff;}
::-webkit-scrollbar{width:0;height:0;}

/* layout */
.container{max-width:520px;margin:0 auto;position:relative;}
@media(min-width:900px){.container{max-width:1080px;}}

/* navbar */
html[data-theme="dark"] .navbar{background:rgba(12,11,10,.75);}
.navbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);transition:box-shadow .25s;}
.navbar.scrolled{box-shadow:0 4px 20px rgba(23,20,15,.06);}
.navbar-in{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;}
.logo{display:flex;align-items:center;gap:8px;font-family:'Anton';font-size:20px;cursor:pointer;transition:transform .2s;}
.logo:active{transform:scale(.96);}
.logo svg{width:26px;height:26px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.logo:hover svg{transform:rotate(-8deg) scale(1.06);}
.navlinks{display:none;gap:4px;font-size:14px;font-weight:600;color:var(--muted);}
@media(min-width:900px){.navlinks{display:flex;}}
.navlinks a{position:relative;padding:8px 12px;border-radius:10px;transition:color .2s, background .2s;}
.navlinks a:hover{color:var(--white);background:var(--glass);}
.navlinks a.navactive{color:var(--red);}
.navlinks a.navactive::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--red);border-radius:2px;}
.navright{display:flex;align-items:center;gap:10px;}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;color:var(--white);flex-shrink:0;transition:transform .2s, background .2s, box-shadow .2s;}
.iconbtn svg{width:18px;height:18px;flex-shrink:0;}
.iconbtn:hover{background:var(--bg3);box-shadow:0 4px 12px rgba(23,20,15,.10);}
.iconbtn:active{transform:scale(.9);}
.iconbtn.bump{animation:cartBump .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes cartBump{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-6deg)}60%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.themebtn{width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--yellow);flex-shrink:0;transition:transform .2s, background .2s;}
.themebtn:hover{background:var(--bg3);}
.themebtn svg{width:18px;height:18px;}
.themebtn:active{transform:scale(.9) rotate(20deg);}
.langsw{display:flex;background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:3px;font-size:11px;font-weight:700;}
.langsw button{padding:5px 9px;border-radius:16px;color:var(--muted);background:transparent;transition:.25s;}
.langsw button.active{background:var(--red);color:#fff;}
.cartbadge{position:absolute;top:-4px;right:-4px;background:var(--yellow);color:#171717;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.cartbadge.pop{animation:badgePop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}

/* bottom nav — compact, attached to the edge, not a floating capsule */
body{padding-bottom:68px;}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg2);backdrop-filter:blur(20px);display:flex;border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(20,20,25,.06);}
@media(min-width:900px){.bottomnav{display:none;}}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 calc(6px + env(safe-area-inset-bottom));color:var(--muted);font-size:9.5px;font-weight:600;position:relative;transition:color .2s;}
.bottomnav a.active{color:var(--red);}
.bottomnav svg{width:19px;height:19px;}

/* hero */
.hero{position:relative;padding:34px 18px 40px;overflow:hidden;background:
  radial-gradient(circle at 20% 0%, rgba(228,29,36,.35), transparent 55%),
  radial-gradient(circle at 90% 30%, rgba(245,197,24,.10), transparent 45%),
  linear-gradient(180deg,var(--bg2),var(--bg));}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--yellow);text-transform:uppercase;margin-bottom:16px;}
.hero h1{font-size:44px;line-height:.96;margin:0 0 14px;}
.hero h1 span{color:var(--red2);display:block;}
.hero p{color:var(--muted);font-size:15px;max-width:360px;margin:0 0 22px;}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;}
.btn{padding:14px 22px;border-radius:14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;position:relative;overflow:hidden;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 26px rgba(228,29,36,.35);}
.btn-primary:hover{background:var(--red2);box-shadow:0 12px 30px rgba(228,29,36,.5);}
.btn-primary::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg);transition:left .65s cubic-bezier(.2,.9,.3,1);pointer-events:none;}
.btn-primary:hover::after{left:130%;}
.btn-ghost{background:var(--glass);border:1px solid var(--border);color:var(--white);transition:background .2s, transform .15s cubic-bezier(.34,1.56,.64,1);}
.btn-ghost:hover{background:rgba(255,255,255,.09);}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;pointer-events:none;}

.floatchips{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
.chip{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;animation:floaty 4.5s ease-in-out infinite;}
.chip:nth-child(2){animation-delay:.6s}.chip:nth-child(3){animation-delay:1.2s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* hero grid + story showcase card */
.hero-grid{display:flex;flex-direction:column;gap:30px;}
@media(min-width:900px){.hero-grid{flex-direction:row;align-items:center;gap:48px;}}
.hero-left{min-width:0;}
@media(min-width:900px){.hero-left{flex:0 0 46%;}}
.hero-right{position:relative;padding-bottom:22px;}
@media(min-width:900px){.hero-right{flex:1;padding-bottom:0;}}

.storycard{position:relative;width:100%;max-width:380px;margin:0 auto;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:var(--bg3);box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid var(--border);isolation:isolate;}
@media(min-width:900px){.storycard{max-width:420px;aspect-ratio:4/5;}}

.story-progress{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:5px;z-index:6;}
.story-progress .seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;}
.story-progress .seg i{display:block;height:100%;width:0%;background:#fff;border-radius:3px;}
.story-progress .seg.done i{width:100%;}
.story-progress .seg.active i{animation:segfill 3.8s linear forwards;}
.storycard.paused .story-progress .seg.active i{animation-play-state:paused;}
@keyframes segfill{from{width:0%}to{width:100%}}

.story-top{position:absolute;top:26px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:6;}
.story-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(20,20,24,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:700;padding:6px 11px 6px 8px;border-radius:20px;}
.story-badge .dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;flex-shrink:0;animation:dotpulse 1.8s infinite;}
@keyframes dotpulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.story-icon{width:30px;height:30px;border-radius:50%;background:rgba(20,20,24,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.story-icon:active{transform:scale(.9);}

.story-slides{position:absolute;inset:0;}
.story-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);transition:opacity 1s ease, transform 4.4s ease;}
.story-slide.active{opacity:1;transform:scale(1);}
.story-slides::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%, transparent 32%, transparent 52%, rgba(0,0,0,.8) 100%);pointer-events:none;}
.story-tapzone{position:absolute;top:0;bottom:0;width:50%;z-index:5;cursor:pointer;}
.story-tapzone.left{left:0;}
.story-tapzone.right{right:0;}

.story-bottom{position:absolute;left:20px;right:20px;bottom:22px;z-index:6;pointer-events:none;}
.story-bottom h3{color:#fff;font-size:28px;margin:0 0 12px;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.5);transition:opacity .3s;}
.story-dots{display:flex;gap:6px;pointer-events:auto;}
.story-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s;}
.story-dot.active{background:#fff;width:18px;border-radius:3px;}

.story-callpill{position:absolute;left:16px;bottom:-18px;background:var(--yellow);color:#111;border-radius:16px;padding:10px 16px;box-shadow:0 14px 30px rgba(0,0,0,.35);z-index:7;animation:floaty 4.5s ease-in-out infinite;}
.story-callpill .ccp-label{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.7;}
.story-callpill .ccp-phone{font-size:14px;font-weight:800;font-family:'JetBrains Mono';margin-top:2px;}

/* section titles */
.section{padding:26px 16px;}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.sectitle h2{font-size:24px;margin:0;}
.sectitle h2 svg{width:19px;height:19px;vertical-align:-3px;margin-right:7px;}
.sectitle .sub{color:var(--muted);font-size:12px;}

/* hero3 — food-first hero */
.hero3{position:relative;margin:14px 16px 4px;border-radius:26px;overflow:hidden;
  background:linear-gradient(150deg,#1a1815 0%,#171717 55%,#241512 100%);
  animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both;
  display:flex;flex-direction:column;}
@media(min-width:720px){.hero3{flex-direction:row;align-items:stretch;}}
.hero3-copy{padding:32px 22px 26px;position:relative;z-index:1;}
@media(min-width:720px){.hero3-copy{flex:1;padding:44px 10px 44px 36px;display:flex;flex-direction:column;justify-content:center;}}
.hero3-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase;margin-bottom:16px;}
.hero3-title{font-family:'Anton';font-size:30px;line-height:1.05;margin:0 0 14px;color:#fff;max-width:320px;}
.hero3-title span{color:var(--red2);display:block;margin-top:2px;font-size:.82em;}
.hero3-p{color:rgba(255,255,255,.6);font-size:13.5px;max-width:300px;margin:0 0 22px;line-height:1.5;}
.hero3-cta{display:flex;gap:10px;flex-wrap:wrap;}
.hero3-cta .btn-ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff;}
.btn-lg{padding:16px 26px;font-size:15px;}
.hero3-visual{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
@media(min-width:720px){.hero3-visual{flex:0 0 42%;min-height:auto;}}
.hero3-glow{position:absolute;width:80%;height:80%;border-radius:50%;background:radial-gradient(circle, rgba(229,27,35,.35), transparent 70%);filter:blur(10px);animation:heroGlow 4s ease-in-out infinite;}
@keyframes heroGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.hero3-img{position:relative;z-index:1;width:78%;max-width:280px;object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5));animation:heroImgIn .7s cubic-bezier(.16,1,.3,1) both;}
@keyframes heroImgIn{from{opacity:0;transform:translateX(24px) scale(.94)}to{opacity:1;transform:translateX(0) scale(1)}}
.hero3-placeholder{position:relative;z-index:1;width:120px;height:120px;color:rgba(255,255,255,.5);animation:heroImgIn .7s cubic-bezier(.16,1,.3,1) both;}
.hero3-placeholder svg{width:100%;height:100%;}

/* hero food illustration — custom vector art, no stock photos/emoji */
.hero-illo-wrap{position:relative;z-index:1;width:82%;max-width:290px;animation:heroFloat 5s ease-in-out infinite;}
.hero-illustration{width:100%;height:100%;display:block;filter:drop-shadow(0 22px 30px rgba(0,0,0,.45));transition:transform .35s cubic-bezier(.2,.9,.3,1);}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-illustration .hi-fries{transform-box:fill-box;transform-origin:bottom center;animation:hiSlideL .6s .15s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-drink{transform-box:fill-box;transform-origin:bottom center;animation:hiSlideR .6s .25s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-bunbottom{transform-box:fill-box;transform-origin:center;animation:hiRise .5s .55s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-patty{transform-box:fill-box;transform-origin:center;animation:hiSlideL .45s .45s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-cheese{transform-box:fill-box;transform-origin:top center;animation:hiMelt .5s .65s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-lettuce{transform-box:fill-box;transform-origin:center;animation:hiSlideR .4s .5s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-tomato{transform-box:fill-box;transform-origin:center;animation:hiDrop .4s .7s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .hi-buntop{transform-box:fill-box;transform-origin:center;animation:hiDrop .6s .3s cubic-bezier(.34,1.56,.64,1) both;}
.hero-illustration .steamline{animation:hiSteam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center;}
.hero-illustration .steamline.s2{animation-delay:.5s;}
.hero-illustration .steamline.s3{animation-delay:1s;}
.hero-illustration .hi-sparkle{transform-box:fill-box;transform-origin:center;animation:hiTwinkle 1.8s ease-in-out infinite;}
.hero-illustration .sp1{--sx:88px;--sy:112px;animation-delay:.2s;}
.hero-illustration .sp2{--sx:244px;--sy:150px;animation-delay:.8s;}
.hero-illustration .sp3{--sx:206px;--sy:88px;animation-delay:1.3s;}
@keyframes hiDrop{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes hiRise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes hiSlideL{from{opacity:0;transform:translateX(-26px) rotate(-6deg)}to{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes hiSlideR{from{opacity:0;transform:translateX(26px) rotate(6deg)}to{opacity:1;transform:translateX(0) rotate(0)}}
@keyframes hiMelt{from{opacity:0;transform:translateY(-12px) scaleY(.6)}to{opacity:1;transform:translateY(0) scaleY(1)}}
@keyframes hiSteam{0%{opacity:0;transform:translateY(0) scaleX(1)}35%{opacity:.65}100%{opacity:0;transform:translateY(-24px) scaleX(1.3)}}
@keyframes hiTwinkle{0%,100%{opacity:.15;transform:translate(var(--sx),var(--sy)) scale(.7)}50%{opacity:1;transform:translate(var(--sx),var(--sy)) scale(1.15)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.reveal{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both;}

/* food placeholder used inside cards without a real photo yet */
.foodplaceholder{width:44%;height:44%;color:var(--muted);opacity:.55;}
.foodplaceholder svg{width:100% !important;height:100% !important;margin:0 !important;}

/* bestseller cards */
.bscard{flex:0 0 76%;max-width:280px;scroll-snap-align:start;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 18px rgba(20,20,25,.06);transition:transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s;}
@media(hover:hover){.bscard:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(23,20,15,.16);}}
@media(min-width:640px){.bscard{flex:0 0 300px;}}
.bscard-media{height:170px;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%, rgba(229,27,35,.10), transparent 60%),var(--bg3);}
.bscard-media img{width:100%;height:100%;object-fit:cover;}
.bscard-flag{position:absolute;top:10px;left:10px;display:flex;align-items:center;background:linear-gradient(120deg,var(--red),var(--orange));color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:5px 9px;border-radius:8px;text-transform:uppercase;z-index:1;}
.bscard-body{padding:14px;}
.bscard-body h3{font-weight:800;font-size:15px;margin:0 0 3px;}

.save-line{font-size:11px;font-weight:800;color:var(--green);margin-bottom:8px;}

/* why united */
.whygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:640px){.whygrid{grid-template-columns:1fr;}}
.whytile{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:20px 16px;text-align:center;}
.whyicon{width:38px;height:38px;margin:0 auto 12px;color:var(--red);}
.whyicon svg{width:100%;height:100%;}
.whytitle{font-weight:800;font-size:14px;margin-bottom:4px;}
.whysub{font-size:11.5px;color:var(--muted);line-height:1.4;}

/* nearest branch widget */
.nearbranch-box{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;flex-wrap:wrap;}
.nearbranch-box.active{border-color:rgba(229,27,35,.25);}
.nearbranch-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nearbranch-icon svg{width:21px;height:21px;}
.nearbranch-icon.spin svg{animation:spin 1.4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.nearbranch-txt{flex:1;min-width:160px;}
.nearbranch-eyebrow{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--red);margin-bottom:3px;}
.nearbranch-title{font-weight:800;font-size:14px;margin-bottom:2px;}
.nearbranch-sub{font-size:12px;color:var(--muted);}

/* final CTA */
.finalcta{margin:30px 16px 0;padding:40px 24px;border-radius:26px;text-align:center;background:linear-gradient(150deg,#1a1815,#171717 60%,#2a1512);}
.finalcta h2{font-family:'Anton';font-size:26px;color:#fff;margin:0 0 6px;}
.finalcta p{color:rgba(255,255,255,.6);font-size:13.5px;margin:0 0 20px;}

/* scroller */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{display:none;}

/* category pills */
html[data-theme="dark"] .catrow{background:linear-gradient(180deg, rgba(8,8,10,.95), rgba(8,8,10,.75));}
.catrow{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;position:sticky;top:57px;z-index:40;background:linear-gradient(180deg, rgba(241,241,243,.97), rgba(241,241,243,.8));backdrop-filter:blur(10px);}
.catpill{white-space:nowrap;padding:9px 15px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:13px;font-weight:700;color:var(--white);transition:background .25s, color .25s, border-color .25s, transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;box-shadow:0 2px 8px rgba(20,20,25,.05);display:inline-flex;align-items:center;}
.catpill:active{transform:scale(.94);}
@media(hover:hover){.catpill:not(.active):hover{border-color:var(--red);color:var(--red);}}
.catpill.active{background:var(--red);color:#fff;border-color:var(--red);transform:scale(1.05);box-shadow:0 8px 18px rgba(229,27,35,.35);}

.searchwrap{padding:0 16px 12px;}
.logo span{color:var(--red);}
.quicktiles{display:flex;gap:10px;padding:14px 16px 4px;overflow-x:auto;}
.quicktiles::-webkit-scrollbar{display:none;}
.quicktile{flex:1;min-width:96px;background:var(--bg2);border:1px solid var(--border);border-radius:18px;overflow:hidden;text-align:center;cursor:pointer;transition:transform .2s;}
.quicktile:active{transform:scale(.94);}
.quicktile .qt-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.quicktile .qt-emoji{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--bg3);}
.quicktile .qt-label{padding:8px 4px;font-size:12px;font-weight:700;color:var(--white);}
.promorow2{display:flex;gap:10px;padding:10px 16px 4px;}
.promotile{flex:1;display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;transition:transform .2s;}
.promotile:active{transform:scale(.96);}
.promotile .pt-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;border-radius:11px;background:rgba(228,29,36,.1);color:var(--red);}
.promotile .pt-icon svg{width:20px;height:20px;}
.promotile .pt-label{font-size:13px;font-weight:800;color:var(--white);}
.comboshow{display:flex;gap:12px;overflow-x:auto;padding:12px 16px;scroll-snap-type:x mandatory;scroll-behavior:smooth;}
.comboshow::-webkit-scrollbar{display:none;}
.comboshow-card{flex:0 0 68%;max-width:240px;scroll-snap-align:start;background:var(--bg2);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(20,20,25,.06);}
.comboshow-card .cs-media{width:100%;height:130px;object-fit:cover;display:block;background:var(--bg3);}
.comboshow-card .cs-media-emoji{width:100%;height:130px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bg3);}
.comboshow-card .cs-body{padding:10px 12px;}
.comboshow-card h4{font-size:13.5px;margin:0 0 4px;color:var(--white);}
.comboshow-card .cs-price{font-size:13px;font-weight:800;color:var(--red);}
.catpill-img{width:18px;height:18px;border-radius:50%;object-fit:cover;margin-right:6px;}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:11px 14px;transition:border-color .2s, box-shadow .2s;}
.searchbox .search-ic{display:flex;flex-shrink:0;color:var(--muted);}
.searchbox .search-ic svg{width:17px;height:17px;}
.searchbox:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,27,35,.10);}
.searchbox input{flex:1;background:transparent;border:none;color:var(--white);font-size:14px;outline:none;}
.searchbox input::placeholder{color:var(--muted);}

/* product grid/card */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr;}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;transition:transform .3s cubic-bezier(.2,.9,.3,1), border-color .3s, box-shadow .3s;animation:cardIn .5s cubic-bezier(.16,1,.3,1) both;box-shadow:0 6px 18px rgba(20,20,25,.06);}
.card:active{transform:scale(.97);}
@media(hover:hover){.card:hover{transform:translateY(-6px);border-color:rgba(229,27,35,.35);box-shadow:0 20px 40px rgba(23,20,15,.16);}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.grid .card:nth-child(1){animation-delay:.02s}.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.1s}
.grid .card:nth-child(4){animation-delay:.14s}.grid .card:nth-child(5){animation-delay:.18s}.grid .card:nth-child(6){animation-delay:.22s}
.grid .card:nth-child(7){animation-delay:.26s}.grid .card:nth-child(8){animation-delay:.3s}.grid .card:nth-child(9){animation-delay:.34s}
.grid .card:nth-child(n+10){animation-delay:.36s}
.card-media{height:150px;display:flex;align-items:center;justify-content:center;position:relative;background:
  radial-gradient(circle at 30% 20%, rgba(228,29,36,.10), transparent 60%),
  radial-gradient(circle at 80% 80%, rgba(245,197,24,.10), transparent 55%),
  var(--bg3);}
.card-media .emoji{font-size:56px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));}
.card-media img,.sheet-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.9,.3,1);}
@media(hover:hover){.card:hover .card-media img{transform:scale(1.07);}}
.sheet-media{overflow:hidden;}
.thumb64{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block;}
.imgpreview{width:100%;height:140px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;}
.imgpreview img{width:100%;height:100%;object-fit:cover;}
.filepick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;background:var(--glass);border:1px dashed var(--border);color:var(--muted);font-size:12.5px;font-weight:600;}
.filepick input{display:none;}
.badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;letter-spacing:.4px;text-transform:uppercase;animation:badgeGlow 2.4s ease-in-out infinite;}
.badge.new{background:linear-gradient(120deg,var(--red),var(--orange));color:#fff;}
.badge.popular{background:linear-gradient(120deg,var(--yellow),var(--orange));color:#171717;}
@keyframes badgeGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 12px 3px rgba(255,255,255,.4)}}
.card-body{padding:12px 12px 12px;}
.card-body h3{font-family:'Inter';font-weight:800;font-size:15px;margin:0 0 2px;text-transform:none;letter-spacing:0;}
.card-sub{font-size:10px;color:var(--red2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.card-desc{font-size:11px;color:var(--muted);line-height:1.4;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-foot{display:flex;flex-direction:column;gap:8px;}
.addtopill{width:100%;padding:10px;border-radius:12px;background:var(--bg3);color:var(--white);font-weight:700;font-size:12.5px;text-align:center;transition:.15s;}
.addtopill:active{transform:scale(.97);}
@media(hover:hover){.addtopill:hover{background:var(--red);color:#fff;}}
.price{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--white);}
.price .old{color:var(--muted);text-decoration:line-through;font-size:11px;margin-right:6px;font-weight:500;}
.addbtn{width:36px;height:36px;border-radius:11px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;}
.aksiya-ribbon{position:absolute;left:0;right:0;bottom:0;display:flex;font-size:12px;font-weight:800;}
.aksiya-ribbon .rb-l{background:linear-gradient(120deg,var(--orange),var(--red));color:#fff;padding:7px 8px;flex:1;text-align:center;}
.aksiya-ribbon .rb-r{background:#171717;color:#fff;padding:7px 8px;flex:1;text-align:center;font-size:11px;}
.addbtn:active{transform:scale(.88);}
@media(hover:hover){.addbtn:hover{transform:scale(1.08);box-shadow:0 6px 16px rgba(228,29,36,.45);}}
.addbtn.pop{animation:popScale .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes popScale{0%{transform:scale(1)}45%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1)}}
.qtybump{animation:qtyBump .32s cubic-bezier(.34,1.56,.64,1);display:inline-block;}
@keyframes qtyBump{0%{transform:scale(1)}50%{transform:scale(1.4);color:var(--red2)}100%{transform:scale(1)}}
.addbtn:active{transform:scale(.9);}
.emptystate{padding:40px 20px;text-align:center;color:var(--muted);}
.emptystate .e{font-size:38px;margin-bottom:10px;}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:auto;}
@media(min-width:640px){.overlay{align-items:center;}}
.sheet{background:var(--bg2);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;border:1px solid var(--border);transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.9,.3,1);padding-bottom:18px;}
@media(min-width:640px){.sheet{border-radius:22px;transform:translateY(10px);}}
.overlay.show .sheet{transform:translateY(0);}
.sheet-drag{width:40px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 0;}
.sheet-head{padding:16px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-media{height:180px;margin:6px 18px 0;border-radius:16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(228,29,36,.32),transparent 60%),var(--bg3);}
.sheet-body{padding:14px 18px 4px;}
.sheet-body h2{font-family:'Inter';font-weight:800;font-size:20px;text-transform:none;margin:0 0 4px;}
.opt-row{display:flex;align-items:center;justify-content:between;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);}
.opt-row label{font-size:13px;font-weight:600;flex:1;}
.opt-row .oprice{font-size:12px;color:var(--muted);font-family:'JetBrains Mono';}
.qtywrap{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:6px;}
.qtybtn{width:34px;height:34px;border-radius:10px;background:var(--bg3);color:var(--white);font-size:18px;display:flex;align-items:center;justify-content:center;}
textarea.noteinput{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--white);font-size:13px;resize:none;margin-top:6px;}
.sheet-foot{padding:14px 18px 0;display:flex;gap:10px;align-items:center;}

/* sticky cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:70px;z-index:55;padding:0 14px;display:flex;justify-content:center;pointer-events:none;}
@media(min-width:900px){.cartbar{bottom:16px;}}
.cartbar-in{pointer-events:auto;width:100%;max-width:492px;background:linear-gradient(120deg,var(--red),var(--reddark));color:#fff;border-radius:16px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(228,29,36,.4);transform:translateY(120px);transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.cartbar-in.bump{animation:cartBump .38s cubic-bezier(.34,1.56,.64,1);}
@keyframes cartBump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(0) scale(1.04)}100%{transform:translateY(0) scale(1)}}
.cartbar-in.show{transform:translateY(0);}
.cartbar-l{font-size:13px;font-weight:700;}
.cartbar-l .n{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:8px;margin-right:8px;font-family:'JetBrains Mono';}
.cartbar-r{display:flex;align-items:center;gap:8px;font-weight:800;font-family:'JetBrains Mono';font-size:14px;}

/* cart page */
.cartline{display:flex;gap:12px;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;align-items:center;}
.cartline .cl-emoji{width:52px;height:52px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.cartline .cl-info{flex:1;min-width:0;}
.cartline h4{margin:0 0 2px;font-size:13.5px;font-weight:700;}
.cartline .cl-meta{font-size:11px;color:var(--muted);}
.cartline .cl-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.qtymini{display:flex;align-items:center;gap:8px;background:var(--glass);border-radius:10px;padding:4px 6px;}
.qtymini button{width:22px;height:22px;border-radius:6px;background:var(--bg3);color:var(--white);font-size:14px;transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;}
.qtymini button:active{transform:scale(.85);}
@media(hover:hover){.qtymini button:hover{background:var(--red);color:#fff;}}
.summarybox{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:6px;}
.sumrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:6px 0;}
.sumrow.total{color:var(--white);font-weight:800;font-size:16px;border-top:1px solid var(--border);margin-top:6px;padding-top:12px;}
.promorow{display:flex;gap:8px;margin-top:10px;}
.promorow input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--white);font-size:13px;}

/* form */
.formgroup{margin-bottom:12px;}
.formgroup label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}
.forminput,.formselect{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;color:var(--white);font-size:14px;}
.forminput:focus,.formselect:focus{outline:none;border-color:var(--red);}
.formrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.segbtns{display:flex;gap:8px;}
.segbtn{flex:1;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);font-weight:700;font-size:13px;color:var(--muted);text-align:center;}
.segbtn.active{background:var(--red);color:#fff;border-color:var(--red);}
.paymethods{display:grid;grid-template-columns:1fr;gap:8px;}
.paymethod{padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--muted);}
.paymethod .pm-ic{display:flex;flex-shrink:0;}
.paymethod .pm-ic svg{width:18px;height:18px;}
.paymethod.active{border-color:var(--red);color:var(--white);background:rgba(228,29,36,.1);}

/* tracking */
.ticket{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:20px;margin:0 16px 18px;}
.ticket-id{font-family:'JetBrains Mono';color:var(--muted);font-size:12px;}
.steps{margin-top:18px;}
.step{display:flex;gap:12px;position:relative;padding-bottom:26px;}
.step:last-child{padding-bottom:0;}
.step .dot{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;z-index:2;}
.step.done .dot{background:var(--red);border-color:var(--red);}
.step.current .dot{background:var(--yellow);border-color:var(--yellow);color:#111;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,197,24,.5)}70%{box-shadow:0 0 0 10px rgba(245,197,24,0)}100%{box-shadow:0 0 0 0 rgba(245,197,24,0)}}
.step:not(:last-child)::after{content:'';position:absolute;left:12.5px;top:26px;width:2px;height:calc(100% - 20px);background:var(--border);}
.step.done:not(:last-child)::after{background:var(--red);}
.step .stxt{padding-top:3px;}
.step .stxt b{display:block;font-size:13.5px;}
.step .stxt span{font-size:11px;color:var(--muted);}

/* admin */
.adminshell{min-height:100vh;background:var(--bg);}
.adminlogin{max-width:340px;margin:14vh auto;padding:30px 24px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;text-align:center;}
.adminnav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--border);}
.adminnav a{white-space:nowrap;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--glass);}
.adminnav a.active{background:var(--red);color:#fff;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;}
@media(min-width:700px){.statgrid{grid-template-columns:repeat(4,1fr);}}
.statcard{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px;}
.statcard .v{font-family:'JetBrains Mono';font-size:22px;font-weight:700;}
.statcard .l{font-size:11px;color:var(--muted);margin-top:3px;}
.barchart{display:flex;align-items:flex-end;justify-content:center;gap:22px;height:150px;padding:22px 16px 6px;}
.barchart .barcol{flex:1;max-width:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;}
.barchart .bar{width:100%;max-width:52px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--red2),var(--red));height:0;transition:height 1.1s cubic-bezier(.16,1,.3,1);box-shadow:0 8px 22px rgba(228,29,36,.35);}
.barchart .barlabel{font-size:11px;color:var(--muted);font-weight:700;}
.barchart .barval{font-size:11.5px;font-family:'JetBrains Mono';color:var(--white);font-weight:700;}
.admintable{width:100%;border-collapse:collapse;font-size:12.5px;}
.admintable th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
.admintable td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.admintable tbody tr{animation:rowIn .35s ease both;transition:background .2s;}
.admintable tbody tr:hover{background:rgba(255,255,255,.03);}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.admintablewrap{overflow-x:auto;padding:0 16px;}
.statusselect{background:var(--bg3);border:1px solid var(--border);color:var(--white);border-radius:8px;padding:6px 8px;font-size:11.5px;}
.statuspills{display:flex;flex-wrap:wrap;gap:6px;}
.statuspill{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap;font-family:inherit;}
.statuspill:hover{transform:translateY(-1px);}
.statuspill.active{background:var(--green);border-color:var(--green);color:#fff;}
.statuspill.cancel.active{background:var(--red2);border-color:var(--red2);color:#fff;}
.orderdelbtn{background:rgba(229,27,35,.1);}
.orderdelbtn:hover{background:rgba(229,27,35,.22);}
.rowactions{display:flex;gap:6px;}
.miniicon{width:28px;height:28px;border-radius:8px;background:var(--glass);display:flex;align-items:center;justify-content:center;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-10px) scale(.92);background:var(--bg3);border:1px solid var(--border);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .35s cubic-bezier(.34,1.56,.64,1), transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(6px) scale(1);}
.upsell-toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(16px);background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);z-index:150;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;max-width:340px;width:calc(100% - 32px);}
.upsell-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.upsell-toast .utxt{font-size:12.5px;font-weight:700;flex:1;}
.upsell-toast button{background:var(--red);color:#fff;padding:9px 14px;border-radius:10px;font-size:11.5px;font-weight:800;white-space:nowrap;flex-shrink:0;}
@media(min-width:900px){.upsell-toast{bottom:24px;}}
.pagehead{padding:16px 16px 0;}
.pagehead h1{font-size:26px;margin:0 0 4px;}
footer.sitefoot{padding:0;margin-top:28px;background:#171717;color:rgba(255,255,255,.55);font-size:12.5px;}
.footgrid{display:grid;grid-template-columns:1fr;gap:26px;padding:34px 20px 24px;}
@media(min-width:640px){.footgrid{grid-template-columns:1.4fr 1fr 1fr;}}
.footdesc{font-size:12.5px;line-height:1.5;max-width:260px;margin:0 0 14px;}
.footsocials{display:flex;gap:10px;}
.footsocials a{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff;transition:.2s;}
.footsocials a:hover{background:var(--red);transform:translateY(-2px);}
.footsocials svg{width:16px;height:16px;}
.footcol-title{color:#fff;font-weight:800;font-size:13px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px;}
.sitefoot .footgrid a{display:block;margin-bottom:9px;color:rgba(255,255,255,.55);transition:color .2s;}
.sitefoot .footgrid a:hover{color:var(--yellow);}
.footcontact{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.footcontact svg{width:15px;height:15px;flex-shrink:0;}
.footbottom{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);text-align:center;font-size:11.5px;}
.branchcard{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px;margin:0 16px 12px;transition:transform .25s, box-shadow .25s;}
@media(hover:hover){.branchcard:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(23,20,15,.10);}}
.branchcard-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.branchcard-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.branchcard-icon svg{width:20px;height:20px;}
.branchcard-top h3{font-family:'Inter';font-size:15.5px;text-transform:none;margin:0;font-weight:800;}
.branchcard-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;margin-bottom:6px;}
.branchcard-row svg{width:15px;height:15px;flex-shrink:0;}
.ordermap{width:100%;height:180px;border:0;border-radius:14px;display:block;background:var(--bg3);}
.ordermapwrap{border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:14px 0;}
.ordermapfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);}
.ordermapfoot span{font-size:11.5px;color:var(--muted);font-weight:600;}
.ordermapfoot a{font-size:12px;font-weight:700;color:var(--red2);display:flex;align-items:center;gap:5px;}
.skel{background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:shine 1.2s infinite;border-radius:16px;height:220px;}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fadein{animation:fade .35s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* splash / initial load screen */
.splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .35s ease;}
.splash.hide{opacity:0;pointer-events:none;}
.splash-mark{width:78px;height:78px;animation:splashPop .55s cubic-bezier(.34,1.56,.64,1) both;}
.splash-mark svg{width:100%;height:100%;}
@keyframes splashPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.splash-word{margin-top:16px;font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.5px;color:var(--white);text-transform:uppercase;}
.splash-dots{display:flex;gap:6px;margin-top:18px;}
.splash-dots i{width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.35;animation:splashDot 1.1s ease-in-out infinite;}
.splash-dots i:nth-child(2){animation-delay:.15s;}
.splash-dots i:nth-child(3){animation-delay:.3s;}
@keyframes splashDot{0%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
</style>
</head>

async function sGet(key, shared){
  try{
    if(shared){
      if(!supabaseClient) return null;
      const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      return data ? data.value : null;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ console.error('sGet failed for', key, e); return null; }
}

async function sSet(key, value, shared){
  try{
    if(shared){
      if(!supabaseClient) return false;
      const { error } = await supabaseClient.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      return true;
    } else {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    }
  }catch(e){ console.error('sSet failed for', key, e); return false; }
}

async function sDelete(key, shared){
  try{
    if(shared){
      if(!supabaseClient) return false;
      const { error } = await supabaseClient.from('kv_store').delete().eq('key', key);
      if(error) throw error;
      return true;
    } else {
      localStorage.removeItem(key);
      return true;
    }
  }catch(e){ console.error('sDelete failed for', key, e); return false; }
}

   makes the admin panel and customer view reflect each other without a manual reload. */

  if(!supabaseClient) return;
  supabaseClient.channel('kv_store_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store' }, () => {
      if(STATE.view === 'admin' && STATE.adminAuthed) loadAdminBody();
      else render();
    })
    .subscribe();
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function branchOpenStatus(hours){
  const m = hours.match(/(\d{2}):(\d{2}).?(\d{2}):(\d{2})/);
  if(!m) return null;
  const now = new Date();
  const cur = now.getHours()*60+now.getMinutes();
  let start = parseInt(m[1])*60+parseInt(m[2]);
  let end = parseInt(m[3])*60+parseInt(m[4]);
  const open = end < start ? (cur>=start || cur<end) : (cur>=start && cur<end);
  return {open, closeLabel: `${m[3]}:${m[4]}`};
}
let GEO_STATE = {status:'idle', lat:null, lng:null, error:null};
function locateNearestBranch(){
  if(!navigator.geolocation){ GEO_STATE={status:'error', error:'unsupported'}; renderNearestBranchWidget(); return; }
  if(!window.isSecureContext){ GEO_STATE={status:'error', error:'insecure_context'}; renderNearestBranchWidget(); return; }
  GEO_STATE = {status:'loading'};
  renderNearestBranchWidget();
  navigator.geolocation.getCurrentPosition(
    pos=>{ GEO_STATE = {status:'granted', lat:pos.coords.latitude, lng:pos.coords.longitude}; renderNearestBranchWidget(); },
    err=>{ GEO_STATE = {status: err.code===1?'denied':'error', error: err.message}; renderNearestBranchWidget(); },
    {enableHighAccuracy:false, timeout:8000}
  );
}

function genPromoCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function promoStatus(promo){
  const today = new Date().toISOString().slice(0,10);
  if(!promo.active) return 'inactive';
  if(promo.endDate && today > promo.endDate) return 'expired';
  if(promo.startDate && today < promo.startDate) return 'scheduled';
  return 'active';
}
function itemMatchesPromoScope(item, promo){
  if(promo.scope==='category') return item.category === promo.scopeCategory;
  if(promo.scope==='product') return item.productId === promo.scopeProduct;
  return true;
}
function computePromoDiscount(promo, cartItems){
  const eligible = cartItems.filter(i=>itemMatchesPromoScope(i,promo)).reduce((a,i)=>a+i.qty*i.unitPrice,0);
  if(eligible<=0) return 0;
  if(promo.type==='percent') return Math.round(eligible * promo.value/100);
  return Math.min(promo.value, eligible);
}
function currentPromoDiscount(){
  if(!STATE._promo) return 0;
  return computePromoDiscount(STATE._promo, STATE.cart);
}

/* ============ order creation & tracking ============ */
function genOrderId(){ return 'UB-' + Math.floor(100000 + Math.random()*899999); }

async function placeOrder(form){
  const id = genOrderId();
  const items = STATE.cart.map(c=>({...c}));
  const subtotal = cartTotal();
  const fee = form.mode === 'delivery' ? DELIVERY_FEE : 0;
  const discount = form.discount||0;
  const total = subtotal + fee - discount;
  const order = {
    id, createdAt: Date.now(), status:'received',
    name: form.name, phone: form.phone, mode: form.mode,
    address: form.address||'', apartment: form.apartment||'', floor: form.floor||'',
    comment: form.comment||'', branch: form.branch||'', payment: form.payment,
    lat: form.lat||null, lng: form.lng||null,
    promoCode: form.promoCode||'', discount,
    items, subtotal, fee, total, statusUpdatedAt: Date.now()
  };
  await sSet('order:'+id, order, true);
  let list = (await sGet('orders:list', true)) || [];
  list.unshift({id, name: form.name, phone: form.phone, total, status:'received', createdAt: order.createdAt});
  await sSet('orders:list', list, true);
  STATE.cart = []; await persistCart();
  STATE.activeOrder = {id, status:'received', total};
  STATE._trackCache = order;
  await sSet('activeOrderId', id, false);
  navigate('track', {currentOrderId:id});
}

function renderView(){
  switch(STATE.view){
    case 'home': return renderHome();

function renderQuickTiles(catsWithProducts){
  const preferred = ['burger','hotdog','snack'];
  let picks = preferred.map(id=>catsWithProducts.find(c=>c.id===id)).filter(Boolean);
  if(picks.length < 3){
    catsWithProducts.forEach(c=>{ if(picks.length<3 && !picks.includes(c)) picks.push(c); });
  }
  if(!picks.length) return '';
  return `<div class="quicktiles">
    ${picks.map(c=>`<div class="quicktile" data-scrollto-direct="cat-${c.id}">
      ${c.image?`<img class="qt-img" src="${c.image}">`:`<div class="qt-emoji">${c.emoji}</div>`}
      <div class="qt-label">${LANG==='uz'?c.uz:c.ru}</div>
    </div>`).join('')}
  </div>`;
}

function statusIndex(s){ return STATUS_FLOW.indexOf(s); }

  if(!order){ return `<div class="skel" style="margin:16px;"></div>`; }
  const idx = statusIndex(order.status);
  const steps = STATUS_FLOW.map((s,i)=>({
    key:s, done: i<idx, current: i===idx,

  return `
  <div class="ticket">

        <div class="dot">${s.done?'✓':(s.current?'•':'')}</div>
        <div class="stxt"><b>${t('status_'+s.key)}</b>${s.current?`<span>${new Date(order.statusUpdatedAt).toLocaleTimeString()}</span>`:''}</div>
      </div>`).join('')}

      ${order.discount ? `<div class="sumrow"><span>${t('discount')} ${order.promoCode?'· '+order.promoCode:''}</span><span class="mono" style="color:var(--red2)">−${money(order.discount)}</span></div>` : ''}

  </div>`;

async function pollActive(){
  if(!STATE.activeOrder) return;
  const order = await sGet('order:'+STATE.activeOrder.id, true);
  if(!order) return;
  const statusChanged = STATE.activeOrder.status !== order.status;
  STATE.activeOrder.status = order.status; STATE.activeOrder.total = order.total;
  if(STATE.view==='track' && STATE.currentOrderId===order.id){
    STATE._trackCache = order;
    const body = document.getElementById('trackBody');
    if(body) body.innerHTML = trackBodyHTML(order);
  }
  if(statusChanged && STATE.view!=='track'){
    showToast(`📦 ${order.id} · ${t('status_'+order.status)}`);
  }
  if(['delivered','cancelled'].includes(order.status)){
    STATE.activeOrder = null;
    await sSet('activeOrderId', null, false);
  }
}
setInterval(pollActive, 4000);

/* ============ event wiring ============ */
function attachEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const view = el.getAttribute('data-nav');
      const cat = el.getAttribute('data-cat');
      navigate(view, cat ? {catFilter:cat, search:''} : {});
    });
  });
  document.querySelectorAll('[data-copypromo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const code = el.getAttribute('data-copypromo');
      if(navigator.clipboard) navigator.clipboard.writeText(code).catch(()=>{});
      showToast(t('copied'));
    });
  });
  initComboShowcaseAutoScroll();
  document.querySelectorAll('[data-lang]').forEach(el=>{
    el.addEventListener('click', async e=>{

    if(!window.isSecureContext){
      showToast(LANG==='uz'?'Faqat HTTPS saytda ishlaydi':'Работает только на HTTPS-сайте');
      return;
    }

      } else if(err.code === err.POSITION_UNAVAILABLE){

      } else if(err.code === err.TIMEOUT){
        msg = LANG==='uz' ? 'Vaqt tugadi, qayta urinib ko\'ring' : 'Истекло время ожидания, попробуйте снова';

        msg = LANG==='uz' ? 'Xatolik yuz berdi' : 'Произошла ошибка';

  initHeroStory();

}

/* ============ hero story card ============ */
function updateHeroStoryDOM(){
  const card = document.getElementById('storyCard');
  if(!card) return;
  card.querySelectorAll('.story-slide').forEach(el=>{
    el.classList.toggle('active', parseInt(el.getAttribute('data-slide'))===heroSlideIdx);
  });
  card.querySelectorAll('.story-dot').forEach(el=>{
    el.classList.toggle('active', parseInt(el.getAttribute('data-dot'))===heroSlideIdx);
  });
  card.querySelectorAll('.story-progress .seg').forEach(el=>{
    const i = parseInt(el.getAttribute('data-seg'));
    el.classList.remove('active','done');
    if(i<heroSlideIdx) el.classList.add('done');
    else if(i===heroSlideIdx) el.classList.add('active');
  });
  const titleEl = document.getElementById('storyTitle');
  if(titleEl) titleEl.textContent = LANG==='uz'?HERO_SLIDES[heroSlideIdx].title_uz:HERO_SLIDES[heroSlideIdx].title_ru;
}
function heroGoTo(i){
  heroSlideIdx = ((i % HERO_SLIDES.length) + HERO_SLIDES.length) % HERO_SLIDES.length;
  updateHeroStoryDOM();
  heroRestartTimer();
}
function heroNext(){ heroGoTo(heroSlideIdx+1); }
function heroPrev(){ heroGoTo(heroSlideIdx-1); }
function heroRestartTimer(){
  clearInterval(heroTimer);
  if(heroPaused) return;
  heroTimer = setInterval(()=>{
    heroSlideIdx = (heroSlideIdx+1) % HERO_SLIDES.length;
    updateHeroStoryDOM();
  }, 3800);
}
function initHeroParallax(){
  const visual = document.getElementById('heroVisual');
  const illo = visual?.querySelector('.hero-illustration');
  if(!visual || !illo) return;
  if(window.matchMedia('(hover: none)').matches) return;
  visual.addEventListener('mousemove', e=>{
    const r = visual.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    illo.style.transform = `perspective(600px) rotateY(${px*12}deg) rotateX(${-py*12}deg)`;
  });
  visual.addEventListener('mouseleave', ()=>{ illo.style.transform = ''; });
}
function initHeroStory(){
  const card = document.getElementById('storyCard');
  clearInterval(heroTimer);
  if(!card) return;
  document.getElementById('storyPauseBtn')?.addEventListener('click', ()=>{
    heroPaused = !heroPaused;
    card.classList.toggle('paused', heroPaused);
    const btn = document.getElementById('storyPauseBtn');
    if(btn) btn.textContent = heroPaused ? '▶' : '⏸';
    heroRestartTimer();
  });
  document.getElementById('storyNext')?.addEventListener('click', heroNext);
  document.getElementById('storyPrev')?.addEventListener('click', heroPrev);
  card.querySelectorAll('.story-dot').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); heroGoTo(parseInt(el.getAttribute('data-dot'))); });
  });
  card.classList.toggle('paused', heroPaused);
  heroRestartTimer();
}

function startOfDay(d){ const dt = new Date(d); dt.setHours(0,0,0,0); return dt.getTime(); }
function startOfWeek(d){ const dt = new Date(d); const day = (dt.getDay()+6)%7; dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day); return dt.getTime(); }
function startOfMonth(d){ const dt = new Date(d); dt.setHours(0,0,0,0); dt.setDate(1); return dt.getTime(); }
async function renderAdminDashboard(){
  const list = (await sGet('orders:list', true)) || [];
  const today = new Date().toDateString();
  const todays = list.filter(o=> new Date(o.createdAt).toDateString()===today);
  const revenue = list.filter(o=>o.status==='delivered').reduce((a,o)=>a+o.total,0);
  const avg = list.length ? Math.round(list.reduce((a,o)=>a+o.total,0)/list.length) : 0;
  const pending = list.filter(o=>!['delivered','cancelled'].includes(o.status)).length;
  const now = Date.now();
  const periodStats = (startTs)=>{
    const items = list.filter(o=>o.createdAt>=startTs && o.status!=='cancelled');
    return { count: items.length, revenue: items.reduce((a,o)=>a+o.total,0) };
  };
  const dayS = periodStats(startOfDay(now));
  const weekS = periodStats(startOfWeek(now));
  const monthS = periodStats(startOfMonth(now));
  const maxRev = Math.max(dayS.revenue, weekS.revenue, monthS.revenue, 1);
  const pct = (v)=> v<=0 ? 4 : Math.max(8, Math.round(v/maxRev*100));
  return `
  <div class="statgrid">
    <div class="statcard"><div class="v" data-countup="${todays.length}">0</div><div class="l">${t('today_orders')}</div></div>
    <div class="statcard"><div class="v" data-countup="${revenue}" data-money="1">0</div><div class="l">${t('revenue')}</div></div>
    <div class="statcard"><div class="v" data-countup="${avg}" data-money="1">0</div><div class="l">${t('avg_order')}</div></div>
    <div class="statcard"><div class="v" data-countup="${pending}">0</div><div class="l">${t('pending')}</div></div>
  </div>
  <div class="pagehead" style="padding-top:0;"><h1 style="font-size:16px;">${t('period_stats')}</h1></div>
  <div class="admintablewrap"><div class="barchart">
    <div class="barcol"><div class="barval" data-countup="${dayS.revenue}" data-money="1">0</div><div class="bar" data-barheight="${pct(dayS.revenue)}"></div><div class="barlabel">${t('daily')}</div></div>
    <div class="barcol"><div class="barval" data-countup="${weekS.revenue}" data-money="1">0</div><div class="bar" data-barheight="${pct(weekS.revenue)}"></div><div class="barlabel">${t('weekly')}</div></div>
    <div class="barcol"><div class="barval" data-countup="${monthS.revenue}" data-money="1">0</div><div class="bar" data-barheight="${pct(monthS.revenue)}"></div><div class="barlabel">${t('monthly')}</div></div>
  </div></div>
  <div class="admintablewrap" style="margin-top:12px;"><table class="admintable">
    <thead><tr><th></th><th>${t('orders_count')}</th><th>${t('revenue')}</th></tr></thead>
    <tbody>
      <tr><td style="font-weight:700;color:var(--white);">${t('daily')}</td><td class="mono" data-countup="${dayS.count}">0</td><td class="mono" data-countup="${dayS.revenue}" data-money="1">0</td></tr>
      <tr><td style="font-weight:700;color:var(--white);">${t('weekly')}</td><td class="mono" data-countup="${weekS.count}">0</td><td class="mono" data-countup="${weekS.revenue}" data-money="1">0</td></tr>
      <tr><td style="font-weight:700;color:var(--white);">${t('monthly')}</td><td class="mono" data-countup="${monthS.count}">0</td><td class="mono" data-countup="${monthS.revenue}" data-money="1">0</td></tr>
    </tbody>
  </table></div>
  <div class="pagehead" style="padding-top:0;"><h1 style="font-size:16px;">${t('orders')}</h1></div>
  <div class="admintablewrap"><table class="admintable">
    <thead><tr><th>${t('order_id')}</th><th>${t('customer')}</th><th>${t('total')}</th><th>${t('change_status')}</th></tr></thead>
    <tbody>${list.slice(0,8).map(o=>`<tr><td class="mono">${o.id}</td><td>${o.name}</td><td class="mono">${money(o.total)}</td><td>${t('status_'+o.status)}</td></tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">${t('no_orders')}</td></tr>`}</tbody>
  </table></div><div style="height:20px"></div>`;
}

let PENDING_PRODUCT_IMAGE = null;
async function fileToDataURL(file, maxW=680, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  document.getElementById('cModalClose')?.addEventListener('click', ()=>{ document.getElementById('categoryModalWrap').innerHTML=''; });
  document.getElementById('cModalCancel')?.addEventListener('click', ()=>{ document.getElementById('categoryModalWrap').innerHTML=''; });
  document.getElementById('cOverlay')?.addEventListener('click', e=>{ if(e.target.id==='cOverlay') document.getElementById('categoryModalWrap').innerHTML=''; });
  document.getElementById('cf_imageFile')?.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('cf_filelabel').textContent = '...';
    try{
      const dataUrl = await fileToDataURL(file, 400);
      PENDING_CATEGORY_IMAGE = dataUrl;
      document.getElementById('cf_imgPreview').innerHTML = `<img src="${dataUrl}">`;
      document.getElementById('cf_filelabel').textContent = t('change_photo');
    }catch(err){ showToast('Error'); }

  document.getElementById('cModalSave')?.addEventListener('click', async (e)=>{
    const isNew = e.target.getAttribute('data-isnew') === 'true';
    const id = isNew ? ('cat'+Date.now()) : e.target.getAttribute('data-id');
    const uz = document.getElementById('cf_name_uz').value.trim();
    const ru = document.getElementById('cf_name_ru').value.trim();
    const emoji = document.getElementById('cf_emoji').value.trim() || '🍽️';
    if(!uz || !ru){ showToast(t('fill_required')); return; }
    const obj = {id, emoji, uz, ru, image: PENDING_CATEGORY_IMAGE};

    await sSet('menu:categories', CATS, true);
    document.getElementById('categoryModalWrap').innerHTML = '';
    showToast(t('saved'));
    loadAdminBody();
  });
}

function animateCountUp(el, end, isMoney, duration){
  duration = duration || 900;
  const startTime = performance.now();
  function tick(now){
    const p = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = Math.round(end*eased);
    el.textContent = isMoney ? money(val) : val.toLocaleString('ru-RU').replace(/,/g,' ');
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function runDashboardAnimations(){

  document.querySelectorAll('#adminBody [data-countup]').forEach(el=>{
    const end = parseFloat(el.getAttribute('data-countup'))||0;

function wirePromoModal(){
  document.getElementById('prModalClose')?.addEventListener('click', ()=>{ document.getElementById('promoModalWrap').innerHTML=''; });
  document.getElementById('prModalCancel')?.addEventListener('click', ()=>{ document.getElementById('promoModalWrap').innerHTML=''; });
  document.getElementById('pr_genBtn')?.addEventListener('click', ()=>{
    document.getElementById('pr_code').value = genPromoCode();
  });
  document.getElementById('pr_code')?.addEventListener('input', e=>{
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  });
  document.getElementById('pr_scope')?.addEventListener('change', e=>{
    document.getElementById('pr_catWrap').style.display = e.target.value==='category' ? 'block' : 'none';
    document.getElementById('pr_prodWrap').style.display = e.target.value==='product' ? 'block' : 'none';
  });
  document.getElementById('prModalSave')?.addEventListener('click', async (e)=>{
    const isNew = e.target.getAttribute('data-isnew') === 'true';
    const id = isNew ? ('promo'+Date.now()) : e.target.getAttribute('data-id');
    const errEl = document.getElementById('prModalErr');
    const code = document.getElementById('pr_code').value.trim().toUpperCase();
    const type = document.getElementById('pr_type').value;
    const value = parseFloat(document.getElementById('pr_value').value) || 0;
    const scope = document.getElementById('pr_scope').value;
    const scopeCategory = document.getElementById('pr_scopeCategory')?.value || '';
    const scopeProduct = document.getElementById('pr_scopeProduct')?.value || '';
    const startDate = document.getElementById('pr_start').value;
    const endDate = document.getElementById('pr_end').value;
    const active = document.getElementById('pr_active').checked;

    if(!/^[A-Z0-9]{6}$/.test(code)){ errEl.textContent = t('promo_invalid_code'); showToast(t('promo_invalid_code')); return; }
    const dup = STATE.promos.find(p=>p.code===code && p.id!==id);
    if(dup){ errEl.textContent = t('promo_dup_code'); showToast(t('promo_dup_code')); return; }
    if(!value || value<=0 || (type==='percent' && value>100)){ errEl.textContent = t('promo_invalid_value'); showToast(t('promo_invalid_value')); return; }
    if(startDate && endDate && startDate>endDate){ errEl.textContent = t('promo_invalid_dates'); showToast(t('promo_invalid_dates')); return; }
    errEl.textContent = '';

    const existing = STATE.promos.find(p=>p.id===id);
    const obj = {
      id, code, type, value, scope, scopeCategory, scopeProduct, startDate, endDate, active,
      createdAt: existing ? existing.createdAt : Date.now()
    };
    if(isNew) STATE.promos.push(obj);
    else STATE.promos = STATE.promos.map(p=>p.id===id?obj:p);
    const ok = await sSet('promos:list', STATE.promos, true);
    document.getElementById('promoModalWrap').innerHTML = '';
    showToast(ok ? `✓ ${t('saved')}: ${code}` : t('saved'));
    loadAdminBody();
  });
}
